[package]
name = "cargo-textus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Cargo CLI and macros for user-authored localized documentation"

[lib]
proc-macro = true

[[bin]]
name = "cargo-textus"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "i18n"
path = "tests/i18n.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:serde", "dep:serde_json"]

[dependencies]
anyhow = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
textus-core.workspace = true
syn.workspace = true
quote.workspace = true
